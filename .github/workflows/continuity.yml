name: OSS continuity drill

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 1 * *"

permissions:
  contents: read

concurrency:
  group: continuity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drill:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run local continuity drills
        id: drill
        uses: ./
        with:
          scenario: all
          output: .continuity
      - name: Verify Action outputs (Unix)
        if: success() && runner.os != 'Windows'
        shell: bash
        env:
          MZ_REPORT_DIR: ${{ steps.drill.outputs['report-directory'] }}
          MZ_REPORT_JSON: ${{ steps.drill.outputs['report-json'] }}
          MZ_REPORT_MARKDOWN: ${{ steps.drill.outputs['report-markdown'] }}
          MZ_REPORT_HTML: ${{ steps.drill.outputs['report-html'] }}
          MZ_RECOVERY_DIR: ${{ steps.drill.outputs['recovery-directory'] }}
          MZ_MANIFEST: ${{ steps.drill.outputs['artifact-manifest'] }}
          MZ_CREDENTIAL: ${{ steps.drill.outputs['integrity-credential'] }}
        run: |
          test -d "$MZ_REPORT_DIR"
          test -f "$MZ_REPORT_JSON"
          test -f "$MZ_REPORT_MARKDOWN"
          test -f "$MZ_REPORT_HTML"
          test -d "$MZ_RECOVERY_DIR"
          test -f "$MZ_MANIFEST"
          python -m maintainer_zero validate-report "$MZ_REPORT_JSON"
          python -m maintainer_zero verify-manifest "$MZ_MANIFEST"
          test -f "$MZ_CREDENTIAL"
          python -m maintainer_zero verify-credential "$MZ_CREDENTIAL"
      - name: Verify Action outputs (Windows)
        if: success() && runner.os == 'Windows'
        shell: pwsh
        env:
          MZ_REPORT_DIR: ${{ steps.drill.outputs['report-directory'] }}
          MZ_REPORT_JSON: ${{ steps.drill.outputs['report-json'] }}
          MZ_REPORT_MARKDOWN: ${{ steps.drill.outputs['report-markdown'] }}
          MZ_REPORT_HTML: ${{ steps.drill.outputs['report-html'] }}
          MZ_RECOVERY_DIR: ${{ steps.drill.outputs['recovery-directory'] }}
          MZ_MANIFEST: ${{ steps.drill.outputs['artifact-manifest'] }}
          MZ_CREDENTIAL: ${{ steps.drill.outputs['integrity-credential'] }}
        run: |
          $files = @($env:MZ_REPORT_JSON, $env:MZ_REPORT_MARKDOWN, $env:MZ_REPORT_HTML, $env:MZ_MANIFEST, $env:MZ_CREDENTIAL)
          if (-not (Test-Path -LiteralPath $env:MZ_REPORT_DIR -PathType Container)) { throw "report directory output is missing" }
          if (-not (Test-Path -LiteralPath $env:MZ_RECOVERY_DIR -PathType Container)) { throw "recovery directory output is missing" }
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "file output is missing: $file" }
          }
          python -m maintainer_zero validate-report $env:MZ_REPORT_JSON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m maintainer_zero verify-manifest $env:MZ_MANIFEST
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m maintainer_zero verify-credential $env:MZ_CREDENTIAL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish job summary (Unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          if [[ -f .continuity/report.md ]]; then
            cat .continuity/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Maintainer-Zero report was not generated. Inspect the drill/setup failure above." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish job summary (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path .continuity/report.md -PathType Leaf) {
            Get-Content .continuity/report.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "Maintainer-Zero report was not generated. Inspect the drill/setup failure above." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
      - uses: actions/upload-artifact@v4
        # Upload only artifacts that passed the output, report, manifest, and
        # credential checks. The summary steps above still run on failures so
        # diagnostics remain available without publishing an unverified bundle.
        if: success()
        with:
          name: continuity-report-${{ matrix.os }}
          path: |
            .continuity/continuity.json
            .continuity/report.md
            .continuity/report.html
            .continuity/artifact-manifest.json
            .continuity/continuity-credential.json
            .continuity/history-summary.json
            .continuity/history-summary.md
            .continuity/baseline-comparison.json
            .continuity/recovery/continuity.sarif
            .continuity/recovery/runbook.md
            .continuity/recovery/CODEOWNERS.draft
            .continuity/recovery/issue-drafts.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
