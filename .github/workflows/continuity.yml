name: OSS continuity drill

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 1 * *"

permissions:
  contents: read

concurrency:
  group: continuity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drill:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run local continuity drills
        uses: ./
        with:
          scenario: all
          output: .continuity
      - name: Publish job summary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cat .continuity/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish job summary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-Content .continuity/report.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: continuity-report-${{ matrix.os }}
          path: |
            .continuity/continuity.json
            .continuity/report.md
            .continuity/report.html
            .continuity/recovery/continuity.sarif
            .continuity/recovery/runbook.md
            .continuity/recovery/CODEOWNERS.draft
            .continuity/recovery/issue-drafts.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
