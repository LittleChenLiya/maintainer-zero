name: Maintainer-Zero continuity drill
description: Run a local-first, explainable continuity drill against the checked-out repository
author: Maintainer-Zero contributors
branding:
  color: orange
  icon: shield

inputs:
  path:
    description: Repository path relative to the workspace
    required: false
    default: .
  scenario:
    description: Scenario name or all
    required: false
    default: all
  days:
    description: Simulation horizon in days; leave empty to use continuity.json
    required: false
    default: ""
  output:
    description: Output directory relative to the checked-out repository
    required: false
    default: .continuity
  fail-under:
    description: Optional minimum score from 0 to 100
    required: false
    default: ""
  baseline:
    description: Optional prior continuity.json used for regression comparison
    required: false
    default: ""
  fail-on-score-decrease:
    description: Fail when a baseline scenario score decreases
    required: false
    default: "false"
  fail-on-new-high-risk:
    description: Fail when a baseline comparison adds a high-severity finding
    required: false
    default: "false"
  github-metadata:
    description: Optional reviewed local GitHub metadata snapshot or cache
    required: false
    default: ""
  allow-stale-github-metadata:
    description: Explicitly allow an expired local metadata cache
    required: false
    default: "false"

outputs:
  report-directory:
    description: Absolute path to the generated report directory
    value: ${{ steps.drill_unix.outputs['report-directory'] || steps.drill_windows.outputs['report-directory'] }}
  report-json:
    description: Absolute path to continuity.json
    value: ${{ steps.drill_unix.outputs['report-json'] || steps.drill_windows.outputs['report-json'] }}
  report-markdown:
    description: Absolute path to report.md
    value: ${{ steps.drill_unix.outputs['report-markdown'] || steps.drill_windows.outputs['report-markdown'] }}
  report-html:
    description: Absolute path to report.html
    value: ${{ steps.drill_unix.outputs['report-html'] || steps.drill_windows.outputs['report-html'] }}
  recovery-directory:
    description: Absolute path to generated recovery drafts
    value: ${{ steps.drill_unix.outputs['recovery-directory'] || steps.drill_windows.outputs['recovery-directory'] }}
  artifact-manifest:
    description: Absolute path to the local artifact integrity manifest
    value: ${{ steps.drill_unix.outputs['artifact-manifest'] || steps.drill_windows.outputs['artifact-manifest'] }}

runs:
  using: composite
  steps:
    - name: Install Maintainer-Zero (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        MZ_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --no-deps --no-build-isolation "$MZ_ACTION_PATH"
    - name: Install Maintainer-Zero (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        MZ_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --no-deps --no-build-isolation "$env:MZ_ACTION_PATH"
    - id: drill_unix
      name: Run continuity drill (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        MZ_ACTION_PATH: ${{ github.action_path }}
        MZ_INPUT_WORKSPACE: ${{ github.workspace }}
        MZ_INPUT_PATH: ${{ github.workspace }}/${{ inputs.path }}
        MZ_INPUT_SCENARIO: ${{ inputs.scenario }}
        MZ_INPUT_DAYS: ${{ inputs.days }}
        MZ_INPUT_OUTPUT: ${{ github.workspace }}/${{ inputs.output }}
        MZ_INPUT_FAIL_UNDER: ${{ inputs['fail-under'] }}
        MZ_INPUT_BASELINE: ${{ inputs.baseline }}
        MZ_INPUT_FAIL_SCORE: ${{ inputs['fail-on-score-decrease'] }}
        MZ_INPUT_FAIL_HIGH: ${{ inputs['fail-on-new-high-risk'] }}
        MZ_INPUT_METADATA: ${{ inputs.github-metadata }}
        MZ_INPUT_ALLOW_STALE: ${{ inputs.allow-stale-github-metadata }}
      run: python "$MZ_ACTION_PATH/tools/action_entrypoint.py"
    - id: drill_windows
      name: Run continuity drill (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        MZ_ACTION_PATH: ${{ github.action_path }}
        MZ_INPUT_WORKSPACE: ${{ github.workspace }}
        MZ_INPUT_PATH: ${{ github.workspace }}/${{ inputs.path }}
        MZ_INPUT_SCENARIO: ${{ inputs.scenario }}
        MZ_INPUT_DAYS: ${{ inputs.days }}
        MZ_INPUT_OUTPUT: ${{ github.workspace }}/${{ inputs.output }}
        MZ_INPUT_FAIL_UNDER: ${{ inputs['fail-under'] }}
        MZ_INPUT_BASELINE: ${{ inputs.baseline }}
        MZ_INPUT_FAIL_SCORE: ${{ inputs['fail-on-score-decrease'] }}
        MZ_INPUT_FAIL_HIGH: ${{ inputs['fail-on-new-high-risk'] }}
        MZ_INPUT_METADATA: ${{ inputs.github-metadata }}
        MZ_INPUT_ALLOW_STALE: ${{ inputs.allow-stale-github-metadata }}
      run: python "$env:MZ_ACTION_PATH/tools/action_entrypoint.py"
