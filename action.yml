name: Maintainer-Zero continuity drill
description: Run a local-first, explainable continuity drill against the checked-out repository
author: Maintainer-Zero contributors
branding:
  color: orange
  icon: shield

inputs:
  scenario:
    description: Scenario name or all
    required: false
    default: all
  days:
    description: Simulation horizon in days; leave empty to use continuity.json
    required: false
    default: ""
  output:
    description: Output directory relative to the checked-out repository
    required: false
    default: .continuity
  fail-under:
    description: Optional minimum score from 0 to 100
    required: false
    default: ""
  baseline:
    description: Optional prior continuity.json used for regression comparison
    required: false
    default: ""
  fail-on-score-decrease:
    description: Fail when a baseline scenario score decreases
    required: false
    default: "false"
  fail-on-new-high-risk:
    description: Fail when a baseline comparison adds a high-severity finding
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Maintainer-Zero
      shell: bash
      env:
        MZ_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --no-deps --no-build-isolation "$MZ_ACTION_PATH"
    - name: Run continuity drill
      shell: bash
      env:
        MZ_WORKSPACE: ${{ github.workspace }}
        MZ_SCENARIO: ${{ inputs.scenario }}
        MZ_DAYS: ${{ inputs.days }}
        MZ_OUTPUT: ${{ inputs.output }}
        MZ_FAIL_UNDER: ${{ inputs.fail-under }}
        MZ_BASELINE: ${{ inputs.baseline }}
        MZ_FAIL_SCORE: ${{ inputs.fail-on-score-decrease }}
        MZ_FAIL_HIGH: ${{ inputs.fail-on-new-high-risk }}
      run: |
        set -euo pipefail
        args=("$MZ_WORKSPACE" --scenario "$MZ_SCENARIO" --output "$MZ_OUTPUT")
        if [[ -n "$MZ_DAYS" ]]; then args+=(--days "$MZ_DAYS"); fi
        if [[ -n "$MZ_FAIL_UNDER" ]]; then args+=(--fail-under "$MZ_FAIL_UNDER"); fi
        if [[ -n "$MZ_BASELINE" ]]; then args+=(--baseline "$MZ_BASELINE"); fi
        if [[ "$MZ_FAIL_SCORE" == "true" ]]; then args+=(--fail-on-score-decrease); fi
        if [[ "$MZ_FAIL_HIGH" == "true" ]]; then args+=(--fail-on-new-high-risk); fi
        python -m maintainer_zero simulate "${args[@]}"
