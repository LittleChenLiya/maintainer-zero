[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maintainer-zero"
version = "0.1.0"
description = "Chaos engineering drills for open-source project continuity"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
maintainer-zero = "maintainer_zero.cli:main"

[tool.setuptools.packages.find]
include = ["maintainer_zero*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
