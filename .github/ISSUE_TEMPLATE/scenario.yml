name: Propose an incident scenario
description: Propose a reproducible continuity drill and its evidence.
labels: [enhancement]
body:
  - type: textarea
    id: incident
    attributes:
      label: Incident and affected workflow
      description: What fails, and what observable consequence should the drill reveal?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Inputs and assumptions
      description: Distinguish facts observable in a repository from user-provided or model assumptions.
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: Recovery action and test fixture
      description: Describe a concrete recovery action and a small test case with an expected result.
    validations:
      required: true

