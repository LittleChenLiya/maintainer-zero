name: Release candidate verification

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install release verifier
        run: python -m pip install --disable-pip-version-check "setuptools>=68" wheel --no-deps -e .
      - name: Check tag matches package version
        env:
          MZ_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python -c 'import os, pathlib, tomllib; tag=os.environ["MZ_TAG"]; version=tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]; assert not tag or tag == "v" + version, f"tag {tag!r} does not match package version {version!r}"'
      - name: Build and verify release candidate
        run: python tools/verify_release.py --output "$RUNNER_TEMP/maintainer-zero-release-verify"
      - name: Upload verified release archives
        uses: actions/upload-artifact@v7
        with:
          name: maintainer-zero-release-${{ github.ref_name }}
          path: ${{ runner.temp }}/maintainer-zero-release-verify/artifacts/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true
