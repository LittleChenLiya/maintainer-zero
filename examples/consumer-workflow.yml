name: Maintainer-Zero continuity

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 1 * *"

permissions:
  contents: read

concurrency:
  group: maintainer-zero-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuity:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # This immutable commit is the reviewed v0.2.2 alpha preview.
      # Replace it only after reviewing a newer release and its checks.
      - name: Run Maintainer-Zero
        id: drill
        uses: LittleChenLiya/maintainer-zero@6be5c215555af557bfb1de27e61498a7e233ce00 # v0.2.2
        with:
          scenario: all
          output: .continuity
          fail-under: "70"

      - name: Verify report and integrity artifacts
        if: success() && runner.os != 'Windows'
        shell: bash
        env:
          MZ_REPORT_JSON: ${{ steps.drill.outputs['report-json'] }}
          MZ_MANIFEST: ${{ steps.drill.outputs['artifact-manifest'] }}
          MZ_CREDENTIAL: ${{ steps.drill.outputs['integrity-credential'] }}
          PYTHONPATH: ${{ steps.drill.outputs['action-path'] }}
        run: |
          set -euo pipefail
          test -f "$MZ_REPORT_JSON"
          test -f "$MZ_MANIFEST"
          test -f "$MZ_CREDENTIAL"
          python -m maintainer_zero validate-report "$MZ_REPORT_JSON"
          python -m maintainer_zero verify-manifest "$MZ_MANIFEST"
          python -m maintainer_zero verify-credential "$MZ_CREDENTIAL"

      - name: Verify report and integrity artifacts (Windows)
        if: success() && runner.os == 'Windows'
        shell: pwsh
        env:
          MZ_REPORT_JSON: ${{ steps.drill.outputs['report-json'] }}
          MZ_MANIFEST: ${{ steps.drill.outputs['artifact-manifest'] }}
          MZ_CREDENTIAL: ${{ steps.drill.outputs['integrity-credential'] }}
          PYTHONPATH: ${{ steps.drill.outputs['action-path'] }}
        run: |
          $files = @($env:MZ_REPORT_JSON, $env:MZ_MANIFEST, $env:MZ_CREDENTIAL)
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "required artifact is missing: $file" }
          }
          python -m maintainer_zero validate-report $env:MZ_REPORT_JSON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m maintainer_zero verify-manifest $env:MZ_MANIFEST
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m maintainer_zero verify-credential $env:MZ_CREDENTIAL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add report to job summary
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          if [[ -f .continuity/report.md ]]; then
            cat .continuity/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Maintainer-Zero report was not generated. Inspect the failure above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Add report to job summary (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path .continuity/report.md -PathType Leaf) {
            Get-Content .continuity/report.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "Maintainer-Zero report was not generated. Inspect the failure above." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload reviewed report
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: maintainer-zero-report-${{ matrix.os }}
          path: |
            .continuity/continuity.json
            .continuity/report.md
            .continuity/report.html
            .continuity/artifact-manifest.json
            .continuity/continuity-credential.json
            .continuity/recovery/continuity.sarif
            .continuity/recovery/runbook.md
            .continuity/recovery/CODEOWNERS.draft
            .continuity/recovery/issue-drafts.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
